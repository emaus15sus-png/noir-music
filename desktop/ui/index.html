<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Noir</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="drag"></div>
<aside id="side">
  <div class="brand"><img src="logo.png" alt=""><b>NOIR</b></div>
  <nav class="card">
    <button class="nav" data-view="home"><span class="ico" data-ico="home"></span>Home</button>
    <button class="nav" data-view="search"><span class="ico" data-ico="search"></span>Search</button>
  </nav>
  <section class="card lib">
    <header><span class="ico" data-ico="library"></span><b>Your Library</b><button id="newList" class="round" title="Create playlist"><span class="ico" data-ico="plus"></span></button></header>
    <div id="libList"></div>
  </section>
</aside>
<main id="main"><div id="view"></div></main>
<aside id="queuePanel" class="card" hidden>
  <header><b>Queue</b><button class="round" id="qClose" title="Close"><span class="ico" data-ico="close"></span></button></header>
  <div id="queueList"></div>
</aside>
<footer id="bar">
  <div class="np">
    <img id="npArt" src="logo.png" alt="">
    <div class="meta"><b id="npTitle">Nothing playing</b><span id="npArtist">Pick a song or a mood</span></div>
    <button id="npLike" class="round" title="Save to Liked Songs"><span class="ico" data-ico="heart"></span></button>
  </div>
  <div class="ctl">
    <div class="btns">
      <button id="shuffle" class="round" title="Shuffle what's next"><span class="ico" data-ico="shuffle"></span></button>
      <button id="prev" class="round" title="Previous"><span class="ico" data-ico="prev"></span></button>
      <button id="play" class="play" title="Play (Space)"><span class="ico" data-ico="play"></span></button>
      <button id="next" class="round" title="Next"><span class="ico" data-ico="next"></span></button>
      <button id="qBtn" class="round" title="Queue"><span class="ico" data-ico="queue"></span></button>
    </div>
    <div class="prog"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="extra">
    <span id="devLabel"></span>
    <button id="devBtn" class="round" title="Connect to a device"><span class="ico" data-ico="devices"></span></button>
    <span class="ico vol" data-ico="volume"></span>
    <input id="vol" type="range" min="0" max="100" value="80">
  </div>
</footer>
<div id="devices" class="pop card" hidden></div>
<div id="menu" class="menu" hidden></div>
<div id="modal" hidden><form class="card"><b id="modalTitle"></b><input id="modalInput" maxlength="80"><div><button type="button" id="modalCancel" class="pill ghost">Cancel</button><button class="pill">Save</button></div></form></div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
