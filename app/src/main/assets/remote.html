<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noir Remote</title>
<link rel="icon" href="/logo.png">
<style>
  :root { --bg: #07060b; --panel: #121019; --line: #24202f; --text: #f4f2fa; --dim: #9a94ab; --accent: #9b7bff; --pink: #ff5fa2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header b { letter-spacing: 4px; font-size: 18px; }
  #conn { margin-left: auto; color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  #conn i { width: 9px; height: 9px; border-radius: 50%; background: #e0556b; display: inline-block; }
  #conn.on i { background: #3ecf8e; }
  main { flex: 1; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.1fr); min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; overflow: auto; } }

  #now { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
  #ambient { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.3); opacity: .45; transition: background-image .6s; }
  #now > *:not(#ambient) { position: relative; }
  #art { width: min(300px, 70vw); aspect-ratio: 1; border-radius: 16px; object-fit: cover; box-shadow: 0 20px 60px #000a; background: var(--panel); }
  #title { font-size: 24px; font-weight: 700; margin-top: 22px; max-width: 90%; }
  #artist { color: var(--dim); margin-top: 2px; }
  #bar { width: min(420px, 90%); height: 6px; background: #ffffff22; border-radius: 3px; margin-top: 22px; cursor: pointer; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--pink)); border-radius: 3px; }
  #times { width: min(420px, 90%); display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-top: 6px; }
  #controls { display: flex; align-items: center; gap: 18px; margin-top: 16px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .icon:hover { background: #ffffff14; }
  .icon svg { width: 26px; height: 26px; fill: currentColor; }
  #toggle { width: 66px; height: 66px; background: var(--text); color: #000; }
  #toggle:hover { transform: scale(1.05); background: #fff; }
  #like.on { color: var(--accent); }

  #side { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  nav { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  nav button { padding: 7px 14px; border-radius: 99px; color: var(--dim); }
  nav button.on { background: var(--text); color: #000; font-weight: 600; }
  .tab { display: none; flex: 1; overflow: auto; padding: 10px 12px 20px; }
  .tab.on { display: block; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
  .row:hover { background: #ffffff10; }
  .row img { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: var(--panel); flex: none; }
  .row div { min-width: 0; flex: 1; }
  .row b, .row span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row b { font-weight: 500; }
  .row span { color: var(--dim); font-size: 13px; }
  .row .x { color: var(--dim); width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .row .x:hover { background: #ffffff22; color: var(--text); }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .empty { color: var(--dim); padding: 18px 8px; }
  .go { margin-top: 10px; padding: 10px 20px; border-radius: 99px; background: var(--accent); color: #fff; font-weight: 600; }
  .go:disabled { opacity: .5; cursor: wait; }
  #moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 18px; }
  #moods button { height: 64px; border-radius: 12px; font-weight: 700; font-size: 16px; text-align: left; padding: 0 14px; display: flex; align-items: flex-end; padding-bottom: 10px; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: #000; padding: 9px 18px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <b>NOIR</b><span style="color:var(--dim)">Remote</span>
  <span id="conn"><i></i><span id="connText">Connecting…</span></span>
</header>
<main>
  <section id="now">
    <div id="ambient"></div>
    <img id="art" src="/logo.png" alt="">
    <div id="title">Nothing playing</div>
    <div id="artist">Pick something on the right</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div id="controls">
      <button class="icon" id="like" title="Like"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      <button class="icon" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="icon" id="toggle" title="Play/Pause"><svg viewBox="0 0 24 24"><path id="toggleIcon" d="M8 5v14l11-7z"/></svg></button>
      <button class="icon" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </section>
  <section id="side">
    <nav>
      <button data-tab="queue" class="on">Up next</button>
      <button data-tab="search">Search</button>
      <button data-tab="lists">Playlists</button>
      <button data-tab="mood">Mood DJ</button>
    </nav>
    <div class="tab on" id="queue"></div>
    <div class="tab" id="search">
      <input id="q" placeholder="Songs or artists, then Enter">
      <div id="results"></div>
    </div>
    <div class="tab" id="lists"></div>
    <div class="tab" id="mood">
      <textarea id="feel" rows="3" placeholder="How are you feeling? e.g. &quot;tired after work, want something calm&quot;"></textarea>
      <button class="go" id="feelGo">Make my mix</button>
      <div id="moods"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
const MOODS = [["Happy","#FFB347","#FF5E62"],["Chill","#43C6AC","#191654"],["Energetic","#F7971E","#FF2E63"],["Romantic","#FF6A88","#8E2DE2"],["Sad","#4B6CB7","#182848"],["Focus","#00C9FF","#1F4037"],["Party","#FC466B","#3F5EFB"]];
let state = null, polledAt = 0, lastQueue = "";

async function get(path) { const r = await fetch(path); if (!r.ok) throw new Error(await r.text()); return r.json(); }
// Commands carry X-Noir so the TV knows they come from this page, not some other website
async function cmd(path) { const r = await fetch(path, { method: "POST", headers: { "X-Noir": "1" } }); if (!r.ok) throw new Error(await r.text()); setTimeout(poll, 150); return r.json(); }
const q = o => new URLSearchParams(o).toString();
const time = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t.h); t.h = setTimeout(() => t.classList.remove("on"), 2800); }

// Builds a song row with text set via textContent, so song titles can never inject HTML
function row(title, sub, img, onClick, onRemove) {
  const r = document.createElement("div"); r.className = "row"; r.onclick = onClick;
  const i = document.createElement("img"); i.src = img || "/logo.png"; i.loading = "lazy"; i.onerror = () => { i.onerror = null; i.src = "/logo.png"; };
  const d = document.createElement("div"), b = document.createElement("b"), s = document.createElement("span");
  b.textContent = title; s.textContent = sub; d.append(b, s); r.append(i, d);
  if (onRemove) { const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Remove"; x.onclick = e => { e.stopPropagation(); onRemove(); }; r.append(x); }
  return r;
}
function fill(el, nodes, empty) { el.replaceChildren(...(nodes.length ? nodes : [Object.assign(document.createElement("div"), { className: "empty", textContent: empty })])); }

async function poll() {
  try { state = await get("/state"); polledAt = Date.now(); $("conn").className = "on"; $("connText").textContent = "Connected to your Fire TV"; render(); }
  catch { $("conn").className = ""; $("connText").textContent = "Can't reach the TV. Is Noir open on it?"; }
}

function render() {
  const s = state.song;
  $("title").textContent = s ? s.t : "Nothing playing";
  $("artist").textContent = s ? s.a : "Pick something on the right";
  const art = s && s.i ? s.i : "/logo.png";
  if ($("art").getAttribute("src") !== art) { $("art").src = art; $("ambient").style.backgroundImage = s && s.i ? `url("${encodeURI(s.i)}")` : "none"; }
  $("toggleIcon").setAttribute("d", state.playing ? PAUSE : PLAY);
  $("like").classList.toggle("on", !!state.liked);
  document.title = s ? `${s.t} · Noir Remote` : "Noir Remote";
  const key = JSON.stringify(state.queue);
  if (key !== lastQueue) {
    lastQueue = key;
    fill($("queue"), state.queue.map(x => row(x.t, x.a, x.i, () => cmd("/jump?" + q({ i: x.at })), () => cmd("/remove?" + q({ i: x.at })))), "Nothing queued. Autoplay adds similar songs.");
  }
}

// Smooth progress between polls
setInterval(() => {
  if (!state) return;
  const pos = Math.min(state.dur || 0, state.pos + (state.playing ? Date.now() - polledAt : 0));
  $("fill").style.width = state.dur ? (100 * pos / state.dur) + "%" : "0";
  $("pos").textContent = time(pos); $("dur").textContent = time(state.dur);
}, 250);

$("bar").onclick = e => { if (!state || !state.dur) return; const r = e.currentTarget.getBoundingClientRect(); cmd("/seek?" + q({ ms: Math.round(state.dur * (e.clientX - r.left) / r.width) })); };
$("toggle").onclick = () => cmd("/toggle");
$("next").onclick = () => cmd("/next");
$("prev").onclick = () => cmd("/prev");
$("like").onclick = () => cmd("/like");

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, .tab").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.tab).classList.add("on");
  if (b.dataset.tab === "lists") loadLists();
  if (b.dataset.tab === "search") $("q").focus();
});

$("q").onkeydown = async e => {
  if (e.key !== "Enter" || !$("q").value.trim()) return;
  fill($("results"), [], "Searching…");
  try {
    const songs = await get("/search?" + q({ q: $("q").value.trim() }));
    fill($("results"), songs.map(s => row(s.t, s.a, s.i, () => cmd("/play?" + q({ id: s.id })).then(() => toast("Playing " + s.t)))), "No songs found.");
  } catch { fill($("results"), [], "Search failed. Try again."); }
};

async function loadLists() {
  try {
    const lists = await get("/playlists");
    fill($("lists"), lists.map(l => row(l.name, l.count + (l.count === 1 ? " song" : " songs"), l.i, () => cmd("/playlist?" + q({ name: l.name })).then(() => toast("Playing " + l.name)))), "No playlists yet. Make one with the Mood DJ.");
  } catch { fill($("lists"), [], "Couldn't load playlists."); }
}

// save: what you type becomes a playlist; the mood buttons just play, like the TV's mood cards
async function mood(text, save) {
  const go = $("feelGo"); go.disabled = true; go.textContent = "Making your mix…";
  try { const r = await cmd("/mood?" + q({ text, save: save ? 1 : 0 })); toast(r.name ? `Saved "${r.name}" and playing it` : `Playing your ${text.toLowerCase()} mix`); }
  catch { toast("Couldn't make a mix. Check the TV's internet."); }
  go.disabled = false; go.textContent = "Make my mix";
}
$("feelGo").onclick = () => { const t = $("feel").value.trim(); if (t) mood(t, true); else $("feel").focus(); };
$("feel").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("feelGo").click(); } };
MOODS.forEach(([name, a, b]) => {
  const m = document.createElement("button"); m.textContent = name; m.style.background = `linear-gradient(135deg, ${a}, ${b})`;
  m.onclick = () => mood(name, false); $("moods").append(m);
});

// Space bar plays/pauses the TV
document.onkeydown = e => { if (e.target.matches("input, textarea")) return; if (e.code === "Space") { e.preventDefault(); cmd("/toggle"); } };

poll(); setInterval(poll, 1000);
</script>
</body>
</html>
